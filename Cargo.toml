[package]
name = "regex-replace-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
glob = "0.3"
globset = "0.4"
ignore = "0.4"
regex = "1"
rmcp = { version = "0.9", features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
